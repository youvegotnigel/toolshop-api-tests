name: api-tests

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 1 * * *' # nightly, 06:47 Sri Lanka time
  workflow_dispatch:
    inputs:
      test_env:
        description: Target environment
        type: choice
        options: [public, stub]
        default: public
      grep:
        description: Optional tag filter, e.g. @smoke
        required: false

concurrency:
  group: api-tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Typecheck, lint, format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: node scripts/agent-parity.mts

  test:
    name: API tests
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write # publishes reports to the gh-pages branch
    env:
      CI: true
      # Falls back to the offline stub until the password secrets are added
      TEST_ENV: ${{ inputs.test_env || (secrets.TOOLSHOP_ADMIN_PASSWORD != '' && 'public') || 'stub' }}
      ADMIN_PASSWORD: ${{ secrets.TOOLSHOP_ADMIN_PASSWORD }}
      ALLURE: 1
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci # API tests need no browsers: no "playwright install" step
      - name: Warn when running without credentials
        if: env.TEST_ENV == 'stub' && inputs.test_env != 'stub'
        run: echo "::warning::The TOOLSHOP_ADMIN_PASSWORD secret is not set, so tests ran against the offline stub."
      - name: Run tests
        run: npx playwright test ${{ inputs.grep && format('--grep "{0}"', inputs.grep) || '' }}
      - name: Restore report history
        if: ${{ !cancelled() }}
        run: scripts/ci/restore-history.sh
      - name: Build dashboard and reports
        if: ${{ !cancelled() }}
        run: scripts/ci/build-site.sh
      - name: Dashboard summary
        if: ${{ !cancelled() }}
        run: |
          node -e "const {summary:s}=require('./site/summary.json');console.log('### Automation dashboard\n\n| Pass rate | Coverage | Critical coverage | Tests |\n| --- | --- | --- | --- |\n| '+s.passRate+'% | '+s.coverage+'% | '+s.criticalCoverage+'% | '+s.total+' |')" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: test-reports-${{ github.run_id }}
          retention-days: 14
          path: |
            site/
            test-results/
      - name: Publish to GitHub Pages
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
        run: scripts/ci/publish-pages.sh
