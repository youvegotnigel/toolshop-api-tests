name: spec-drift

on:
  schedule:
    - cron: '41 2 * * 1' # Mondays
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  drift:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Compare live OpenAPI operations with openapi/operations.lock.json
        id: check
        run: node scripts/spec-drift.mts | tee drift.txt
        continue-on-error: true
      - name: Open an issue for an agent or engineer to pick up
        if: steps.check.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "Toolshop API spec drift detected ($(date -u +%F))" \
            --label "spec-drift" \
            --body "$(printf 'The live Toolshop OpenAPI spec no longer matches `openapi/operations.lock.json`.\n\n```\n%s\n```\n\nRun the `check-spec-drift` skill (Claude Code or Copilot) to update clients, schemas and tests.' "$(cat drift.txt)")"
