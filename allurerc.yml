# Allure 3 report configuration: npm run allure:report
name: Toolshop API tests
output: ./allure-report
historyPath: ./allure-history/history.jsonl # enables trend charts across runs (git-ignored)
plugins:
  awesome:
    options:
      reportName: Toolshop API tests
  # Classic Allure 2 layout: overview dashboard, suites, graphs, timeline
  allure2:
    options:
      reportName: Toolshop API tests
# Known bugs: see scripts/ci/allure-known-bugs.mts and AGENTS.md "Known product bugs"
categories:
  rules:
    - name: 'Known bug looks fixed: remove test.fail()'
      matchers:
        labels: { tag: known-bug }
        message: 'Expected to fail, but passed'
    - name: Known product defects
      matchers:
        labels: { tag: known-bug }
        statuses: [failed]
